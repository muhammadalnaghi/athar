# Signed personalFullSms release APK → GitHub ZIP artifact → extract APK → Google Drive.
#
# Signing uses a persistent keystore stored only in repo secrets (never committed).
# Untrusted pull_request runs: unit tests only (no signing secrets, no deploy).
name: Build personal APK

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-personal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
      version_code: ${{ steps.verify.outputs.version_code }}
      version_name: ${{ steps.verify.outputs.version_name }}
      package_id: ${{ steps.verify.outputs.package_id }}
      apk_bytes: ${{ steps.verify.outputs.apk_bytes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (accounting + SMS import + Trends/Today paths)
        run: >
          ./gradlew
          :core:domain:test
          :ingestion:sms-parser:test
          :feature:trends:testDebugUnitTest
          :feature:today:testDebugUnitTest
          --no-daemon --stacktrace

      - name: Decide signed release eligibility
        id: gate
        run: |
          set -euo pipefail
          # Never load signing secrets on pull_request (including same-repo PRs).
          SIGNED=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            SIGNED=true
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "Signed release build enabled: $SIGNED"

      - name: Materialize release keystore from secrets
        if: steps.gate.outputs.signed == 'true'
        env:
          ATHAR_KEYSTORE_BASE64: ${{ secrets.ATHAR_KEYSTORE_BASE64 }}
          ATHAR_STORE_PASSWORD: ${{ secrets.ATHAR_STORE_PASSWORD }}
          ATHAR_KEY_ALIAS: ${{ secrets.ATHAR_KEY_ALIAS }}
          ATHAR_KEY_PASSWORD: ${{ secrets.ATHAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$ATHAR_KEYSTORE_BASE64" | base64 -d > keystore/athar-release.keystore
          test -s keystore/athar-release.keystore
          # Write without leading YAML indentation (Properties parser is strict).
          {
            echo "storeFile=keystore/athar-release.keystore"
            echo "storePassword=${ATHAR_STORE_PASSWORD}"
            echo "keyAlias=${ATHAR_KEY_ALIAS}"
            echo "keyPassword=${ATHAR_KEY_PASSWORD}"
          } > keystore.properties
          # Do not print secret values.
          echo "keystore ready ($(wc -c < keystore/athar-release.keystore) bytes)"

      - name: Assemble personalFullSms release APK
        if: steps.gate.outputs.signed == 'true'
        run: ./gradlew :app:assemblePersonalFullSmsRelease --no-daemon --stacktrace

      - name: Verify APK signature and identity
        id: verify
        if: steps.gate.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/personalFullSms/release/app-personalFullSms-release.apk"
          test -f "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING=$("$AAPT" dump badging "$APK")
          PACKAGE=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -1)
          VCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          VNAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test "$PACKAGE" = "com.athar.personal"
          test -n "$VCODE"
          test -n "$VNAME"
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$CERT_SHA"
          {
            echo "apk_sha256=$APK_SHA"
            echo "cert_sha256<<CERT_EOF"
            echo "$CERT_SHA"
            echo "CERT_EOF"
            echo "version_code=$VCODE"
            echo "version_name=$VNAME"
            echo "package_id=$PACKAGE"
            echo "apk_bytes=$(wc -c < "$APK")"
          } >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE versionCode=$VCODE versionName=$VNAME"
          echo "apk_sha256=$APK_SHA"
          echo "cert_sha256=$CERT_SHA"

      - name: Upload GitHub Actions ZIP artifact (APK inside)
        if: steps.gate.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: athar-personalFullSms-release
          path: app/build/outputs/apk/personalFullSms/release/app-personalFullSms-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record artifact name
        id: meta
        if: steps.gate.outputs.signed == 'true'
        run: echo "artifact_name=athar-personalFullSms-release" >> "$GITHUB_OUTPUT"

  deploy-drive:
    name: Extract ZIP artifact and upload APK to Google Drive
    needs: test-and-build
    if: >
      always() &&
      needs.test-and-build.result == 'success' &&
      needs.test-and-build.outputs.artifact_name != '' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/feat/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Set up Android SDK tools (validate APK)
        uses: android-actions/setup-android@v4
        with:
          packages: build-tools;35.0.0 platform-tools

      - name: Download ZIP artifact from THIS run via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.test-and-build.outputs.artifact_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact-zip"
          ARTIFACT_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name==\"${ARTIFACT_NAME}\") | .id" | head -1)
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::error::Artifact ${ARTIFACT_NAME} not found on run ${RUN_ID}"
            exit 1
          fi
          echo "Downloading artifact id=${ARTIFACT_ID} as ZIP"
          # Explicit ZIP download (not auto-extract).
          gh api "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/artifact-zip/artifact.zip"
          test -s "$RUNNER_TEMP/artifact-zip/artifact.zip"
          # Reject if the download is somehow already a lone APK mislabeled as zip.
          file "$RUNNER_TEMP/artifact-zip/artifact.zip" | tee /tmp/zip-file-type.txt
          grep -qiE 'Zip archive|zip compressed' /tmp/zip-file-type.txt
          echo "zip_bytes=$(wc -c < "$RUNNER_TEMP/artifact-zip/artifact.zip")"

      - name: Extract ZIP and locate single APK
        id: extract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extracted-apk"
          unzip -q "$RUNNER_TEMP/artifact-zip/artifact.zip" -d "$RUNNER_TEMP/extracted-apk"
          echo "Extracted tree:"
          find "$RUNNER_TEMP/extracted-apk" -type f -print
          mapfile -t APKS < <(find "$RUNNER_TEMP/extracted-apk" -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK in ZIP, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]:-}"
            exit 1
          fi
          APK="${APKS[0]}"
          BASE=$(basename "$APK")
          case "$BASE" in
            *personalFullSms*release*.apk|app-personalFullSms-release.apk) ;;
            *)
              echo "::error::Unexpected APK name: $BASE"
              exit 1
              ;;
          esac
          # Must be an APK, never a ZIP renamed with .apk
          file "$APK" | tee /tmp/apk-file-type.txt
          if grep -qiE 'Zip archive|zip compressed' /tmp/apk-file-type.txt; then
            # Android APKs are ZIP containers — require Android package markers.
            if ! unzip -l "$APK" | grep -q 'AndroidManifest.xml'; then
              echo "::error::File looks like a plain ZIP, not an Android APK"
              exit 1
            fi
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$BASE" >> "$GITHUB_OUTPUT"
          echo "Extracted APK: $BASE ($(wc -c < "$APK") bytes)"

      - name: Validate extracted APK (package, signature, checksum)
        id: validate
        env:
          EXPECT_PACKAGE: ${{ needs.test-and-build.outputs.package_id }}
          EXPECT_APK_SHA: ${{ needs.test-and-build.outputs.apk_sha256 }}
          EXPECT_CERT_SHA: ${{ needs.test-and-build.outputs.cert_sha256 }}
          EXPECT_VCODE: ${{ needs.test-and-build.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="${{ steps.extract.outputs.apk_path }}"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          PACKAGE=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -1)
          VCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          VNAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          CERT_SHA=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$PACKAGE" = "com.athar.personal"
          test "$PACKAGE" = "$EXPECT_PACKAGE"
          test "$VCODE" = "$EXPECT_VCODE"
          test "$APK_SHA" = "$EXPECT_APK_SHA"
          test "$CERT_SHA" = "$EXPECT_CERT_SHA"
          {
            echo "apk_sha256=$APK_SHA"
            echo "cert_sha256<<CERT_EOF"
            echo "$CERT_SHA"
            echo "CERT_EOF"
            echo "version_code=$VCODE"
            echo "version_name=$VNAME"
            echo "package_id=$PACKAGE"
            echo "apk_bytes=$(wc -c < "$APK")"
          } >> "$GITHUB_OUTPUT"
          echo "Validated $PACKAGE v$VNAME ($VCODE) sha256=$APK_SHA cert=$CERT_SHA"

      - name: Upload extracted APK to Google Drive (NOT the ZIP)
        id: drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: 1BQbIGFI0i9RXAnTOnkclyoFsblKXHxfv
          APK_PATH: ${{ steps.extract.outputs.apk_path }}
          EXPECT_SHA: ${{ steps.validate.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          if [ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing secret GDRIVE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          SA_FILE="$RUNNER_TEMP/gdrive-sa.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
          if ! python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$SA_FILE" 2>/dev/null; then
            if ! base64 -d "$SA_FILE" > "$RUNNER_TEMP/gdrive-sa.decoded.json" 2>/dev/null \
              || ! python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$RUNNER_TEMP/gdrive-sa.decoded.json" 2>/dev/null; then
              echo "::error::GDRIVE_SERVICE_ACCOUNT_JSON is not valid JSON (and not valid base64 JSON)."
              exit 1
            fi
            mv "$RUNNER_TEMP/gdrive-sa.decoded.json" "$SA_FILE"
          fi
          python3 -c 'import json,sys; e=json.load(open(sys.argv[1]))["client_email"]; print(f"service account: {e}")' "$SA_FILE"

          LOCAL_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          test "$LOCAL_SHA" = "$EXPECT_SHA"

          DEST_NAME=athar-latest.apk
          STAGE="$RUNNER_TEMP/drive-upload"
          mkdir -p "$STAGE"
          # Upload only the extracted .apk (never the GitHub ZIP).
          cp -f "$APK_PATH" "$STAGE/$DEST_NAME"
          file "$STAGE/$DEST_NAME" | tee /tmp/drive-upload-type.txt
          unzip -l "$STAGE/$DEST_NAME" | grep -q 'AndroidManifest.xml'

          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE="$SA_FILE"

          EXISTING_ID=$(rclone lsf "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --files-only --format "pi" 2>/dev/null \
            | awk -F';' -v n="$DEST_NAME" '$1==n {print $2; exit}' || true)
          UPDATED_EXISTING=false
          if [ -n "${EXISTING_ID:-}" ]; then
            UPDATED_EXISTING=true
            echo "Replacing existing $DEST_NAME (prior id=$EXISTING_ID) to avoid duplicate names"
          fi
          # Same pattern as the previous working Drive upload: remove same-name file, then copy APK.
          rclone delete "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --include "$DEST_NAME" \
            --drive-use-trash=false || true
          rclone copy "$STAGE/$DEST_NAME" "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --retries 5 -v

          FILE_ID=$(rclone lsf "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --files-only --format "pi" \
            | awk -F';' -v n="$DEST_NAME" '$1==n {print $2; exit}')
          test -n "${FILE_ID:-}"

          REMOTE_META=$(rclone lsjson "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --files-only \
            | python3 -c 'import json,sys; n="'"$DEST_NAME"'"; files=json.load(sys.stdin); hit=[f for f in files if f.get("Name")==n];
print(json.dumps(hit[0] if hit else {}))')
          REMOTE_SIZE=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("Size",0))' <<<"$REMOTE_META")
          LOCAL_SIZE=$(wc -c < "$STAGE/$DEST_NAME")
          test "$REMOTE_SIZE" = "$LOCAL_SIZE"
          test "${DEST_NAME##*.}" = "apk"
          test "$LOCAL_SIZE" -gt 1000000

          {
            echo "file_id=$FILE_ID"
            echo "file_name=$DEST_NAME"
            echo "file_size=$REMOTE_SIZE"
            echo "mime_type=application/vnd.android.package-archive"
            echo "web_view_link=https://drive.google.com/file/d/${FILE_ID}/view"
            echo "updated_existing=$UPDATED_EXISTING"
            echo "local_sha256=$LOCAL_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Uploaded $DEST_NAME id=$FILE_ID size=$REMOTE_SIZE replaced_same_name=$UPDATED_EXISTING"

      - name: Deployment summary
        run: |
          set -euo pipefail
          cat <<EOF
          === Deployment verified ===
          GitHub ZIP artifact: ${{ needs.test-and-build.outputs.artifact_name }}
          Extracted APK: ${{ steps.extract.outputs.apk_name }}
          package: ${{ steps.validate.outputs.package_id }}
          versionName: ${{ steps.validate.outputs.version_name }}
          versionCode: ${{ steps.validate.outputs.version_code }}
          apk_sha256: ${{ steps.validate.outputs.apk_sha256 }}
          cert_sha256: ${{ steps.validate.outputs.cert_sha256 }}
          Drive file: ${{ steps.drive.outputs.file_name }}
          Drive id: ${{ steps.drive.outputs.file_id }}
          Drive size: ${{ steps.drive.outputs.file_size }}
          Drive MIME: ${{ steps.drive.outputs.mime_type }}
          Updated existing: ${{ steps.drive.outputs.updated_existing }}
          Drive link: ${{ steps.drive.outputs.web_view_link }}
          EOF
          test -n "${{ steps.drive.outputs.file_id }}"
          test "${{ steps.drive.outputs.file_name }}" = "athar-latest.apk"
