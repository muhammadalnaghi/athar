# Builds the sideload personalFullSms debug APK (SMS permissions intact).
# No keystore secrets required: AGP signs with the runner's debug keystore.
# That key is NOT stable across fresh runners — see repo docs / PR notes for
# the secure release-signing plan before putting real financial data on device.
name: Build personal APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-personal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk / targetSdk are locked at 35 in gradle/libs.versions.toml
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run SMS parser unit tests
        run: ./gradlew :ingestion:sms-parser:test --no-daemon --stacktrace

      - name: Assemble personalFullSms debug APK
        run: ./gradlew :app:assemblePersonalFullSmsDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-personalFullSms-debug
          path: app/build/outputs/apk/personalFullSms/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Publishes the same filename into the public Drive folder so the share link
      # stays stable. Requires secret GDRIVE_SERVICE_ACCOUNT_JSON (raw JSON or
      # base64). Share the folder with the service-account client_email as Editor.
      # Folder: https://drive.google.com/drive/folders/1BQbIGFI0i9RXAnTOnkclyoFsblKXHxfv
      - name: Upload APK to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: 1BQbIGFI0i9RXAnTOnkclyoFsblKXHxfv
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/personalFullSms/debug/app-personalFullSms-debug.apk"
          NAME="app-personalFullSms-debug.apk"
          test -f "$APK"
          if [ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing secret GDRIVE_SERVICE_ACCOUNT_JSON. Add the Google service-account key (raw JSON or base64) under Settings → Secrets → Actions, and share folder $GDRIVE_FOLDER_ID with that account as Editor."
            exit 1
          fi

          SA_FILE="$RUNNER_TEMP/gdrive-sa.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
          if ! python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$SA_FILE" 2>/dev/null; then
            base64 -d "$SA_FILE" > "$RUNNER_TEMP/gdrive-sa.decoded.json"
            mv "$RUNNER_TEMP/gdrive-sa.decoded.json" "$SA_FILE"
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$SA_FILE"
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE="$SA_FILE"

          # Drive allows duplicate names; delete prior copies so the public folder
          # keeps a single stable APK entry.
          rclone delete "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --include "$NAME" \
            --drive-use-trash=false \
            || true

          rclone copy "$APK" "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --retries 5 \
            -v

          echo "Uploaded $NAME to Google Drive folder $GDRIVE_FOLDER_ID"
