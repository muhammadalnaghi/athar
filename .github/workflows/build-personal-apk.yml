# Builds the sideload personalFullSms debug APK (SMS permissions intact).
# No keystore secrets required: AGP signs with the runner's debug keystore.
# That key is NOT stable across fresh runners — see repo docs / PR notes for
# the secure release-signing plan before putting real financial data on device.
name: Build personal APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-personal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk / targetSdk are locked at 35 in gradle/libs.versions.toml
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run SMS parser unit tests
        run: ./gradlew :ingestion:sms-parser:test --no-daemon --stacktrace

      - name: Assemble personalFullSms debug APK
        run: ./gradlew :app:assemblePersonalFullSmsDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-personalFullSms-debug
          path: app/build/outputs/apk/personalFullSms/debug/*.apk
          if-no-files-found: error
          retention-days: 14
